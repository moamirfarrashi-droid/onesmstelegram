name: OneSMS Services 60 Days

'on':
  schedule:
    - cron: '30 10,14,17 * * *'
      timezone: 'Asia/Tehran'
    - cron: '55 10 * * *'
      timezone: 'Asia/Tehran'
    - cron: '25,55 11-23 * * *'
      timezone: 'Asia/Tehran'
    - cron: '15 0 * * *'
      timezone: 'Asia/Tehran'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = no send, test = test channel, test_main = one marked test to the main channel, status = report, publish = next due, audit = check overdue posts'
        type: choice
        default: preview
        options: [preview, test, test_main, status, publish, audit]
      day:
        description: 'Day 1 to 60 for preview/test/test_main'
        type: string
        default: '1'
      slot:
        description: '0 = all slots in preview/test; use 1, 2, or 3 for test_main'
        type: choice
        default: '0'
        options: ['0', '1', '2', '3']

permissions:
  contents: write

concurrency:
  group: onesms-publisher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set publication history author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run OneSMS
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '15 0 * * *' && 'audit') || 'publish' }}
          DAY: ${{ inputs.day || '1' }}
          SLOT: ${{ inputs.slot || '0' }}
          ENABLE_POSTING: ${{ vars.ENABLE_POSTING }}
          SERVICE_CAMPAIGN_START_DATE: ${{ vars.SERVICE_CAMPAIGN_START_DATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_TEST_CHANNEL_ID: ${{ secrets.TELEGRAM_TEST_CHANNEL_ID }}
        run: python publish.py --mode "$MODE" --day "$DAY" --slot "$SLOT"
